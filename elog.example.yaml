# Example ELOG connection configuration.
#
# Copy to elog.yaml and edit. One connection per file.
# Only "hostname" is required; every other key falls back to the default shown.
#
# Credentials are NOT read from this file -- they are always prompted for on the
# terminal, so this file is safe to commit.

# Required. A bare host is fine: the scheme is filled in from use_ssl below.
hostname: https://elog.psi.ch

# Name of the logbook on the server. Default: '' (the server's default logbook).
logbook: Linux+Demo

# Subdirectory the logbooks live under, i.e. <host>/<subdir>/<logbook>/.
# Default: ''. Do not set this if hostname already contains a path.
subdir: elogs

# Server port. Default: unset, meaning 80 for http and 443 for https.
# Do not set this if hostname already contains a port.
# port: 8080

# Connect over https. Default: true. Ignored if hostname carries an explicit scheme.
# use_ssl: true

upload:
  attachment_folders:
  - attachments
  - pictures

  # upload attachment folder. The script will try to find attachments in the directory named above.
  # Folder structure:
  # - upload.md
  # - attachments/
  #   - file1.png
  #   - file2.png

  # Per-attachment size cap in megabytes, matching the server's own upload limit (this
  # server caps uploads around 10 MB). An oversized image is re-encoded -- lower JPEG
  # quality first, then downscaled -- to fit; any other oversized attachment (a PDF, a
  # video) is skipped with a warning instead of being sent and rejected by the server.
  # Default: unset, meaning no cap is applied.
  max_attachment_size_mb: 10